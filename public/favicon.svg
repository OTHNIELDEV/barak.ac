<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Blue to Indigo to Violet -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- Shield Subtle Glass Fill Gradient -->
    <linearGradient id="shieldInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10" />
    </linearGradient>

    <!-- Ambient Shadow for Depth -->
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#shieldGrad)" />

  <!-- Subtle Top Highlight Border -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Icon (Lucide Shield matching Barak Academy Logo) -->
  <g transform="translate(106, 106) scale(12.5)" filter="url(#shieldShadow)">
    <path
      d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"
      fill="url(#shieldInnerGrad)"
      stroke="#ffffff"
      stroke-width="1.85"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
